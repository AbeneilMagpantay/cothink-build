<?xml version="1.0" encoding="UTF-8"?>
<!-- cothink v0.1 - normal color at 80% width with 8pt border, used for Mac dock + Linux desktop env icons. -->
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" x="0" y="0" width="100" height="100" viewBox="0, 0, 100, 100">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1a1d23"/>
      <stop offset="1" stop-color="#0d1014"/>
    </linearGradient>
    <linearGradient id="claudeGrad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7adcc8"/>
      <stop offset="1" stop-color="#3a9d8c"/>
    </linearGradient>
    <linearGradient id="geminiGrad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d7a8d1"/>
      <stop offset="1" stop-color="#a464a0"/>
    </linearGradient>
  </defs>
  <rect x="10" y="10" width="80" height="80" rx="18" ry="18" fill="url(#bgGrad)" stroke="#2a2d33" stroke-width="2"/>
  <circle cx="40" cy="50" r="18" fill="url(#claudeGrad)" opacity="0.95"/>
  <circle cx="60" cy="50" r="18" fill="url(#geminiGrad)" opacity="0.95"/>
  <rect x="49" y="37" width="2" height="26" fill="#0d1014" opacity="0.4"/>
</svg>
